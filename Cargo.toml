[package]
name = "nerdfleet"
version = "0.2.1"
authors = ["Pavel Kuksa"]
edition = "2021"
description = "Watch a fleet of machines from one terminal: GPUs, CPUs, memory and the training and inference running on them"
license = "MIT"
rust-version = "1.88"

[dependencies]
nerdmux = { git = "https://github.com/Ndles/nerdmux", rev = "aa4787076d98eec14d881b46de21de3a18da31f1" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.22", features = ["serde"] }
libc = "0.2"
anyhow = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
