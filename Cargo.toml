[package]
name = "nerdfleet"
version = "0.1.0"
authors = ["Pavel Kuksa"]
edition = "2021"
description = "Watch a fleet of machines from one terminal: GPUs, CPUs, memory and the training and inference running on them"
license = "MIT"
rust-version = "1.85"

[dependencies]
nerdmux = { git = "https://github.com/Ndles/nerdmux", rev = "3b525b58db97b1613e23ca9b074b08cc92634b6a" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.22", features = ["serde"] }
libc = "0.2"
anyhow = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
