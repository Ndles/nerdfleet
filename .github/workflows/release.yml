# Tests, then builds the release viewers for x86_64 and aarch64 Linux, each
# carrying agents for both (scripts/release.sh), and one for Apple Silicon
# Macs carrying the same Linux agents (a macOS agent comes later). A tag
# `v*` publishes them as a GitHub release (a pre-release when the tag has a
# `-`, like v0.1.0-rc.1); the tag must match the version in Cargo.toml.
# Started by hand ("Run workflow"), it only builds; the viewers are
# attached to the run:
#   gh run download --repo Ndles/nerdfleet -n nerdfleet-linux -n nerdfleet-macos
#
# nerdmux is private: it is checked out next to nerdfleet, at the commit
# Cargo.toml pins, with a read-only deploy key kept in the secret
# NERDMUX_DEPLOY_KEY, and patched in the way it is on a developer's machine.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  # The Zig Software Foundation's release signing key.
  ZIG_KEY: RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nerdfleet
          persist-credentials: false
      - name: The nerdmux commit Cargo.toml pins
        id: pin
        run: |
          rev=$(sed -n 's/^nerdmux = { git = .*rev = "\([0-9a-f]*\)".*/\1/p' nerdfleet/Cargo.toml)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Ndles/nerdmux
          ref: ${{ steps.pin.outputs.rev }}
          path: nerdmux
          ssh-key: ${{ secrets.NERDMUX_DEPLOY_KEY }}
          persist-credentials: false
      - name: Build against that checkout
        run: |
          mkdir -p .cargo
          printf '[patch."https://github.com/Ndles/nerdmux"]\nnerdmux = { path = "nerdmux" }\n' > .cargo/config.toml
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' nerdfleet/Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nerdfleet
      - name: Check
        working-directory: nerdfleet
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: zig, checked against its hash and signature
        run: |
          sudo apt-get install -y -q minisign
          f="zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://ziglang.org/download/$ZIG_VERSION/$f"
          curl -fsSLO "https://ziglang.org/download/$ZIG_VERSION/$f.minisig"
          echo "$ZIG_SHA256  $f" | sha256sum -c -
          minisign -Vm "$f" -P "$ZIG_KEY"
          tar -xJf "$f"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      - run: cargo install cargo-zigbuild --version 0.24.0 --locked
      - name: Release build
        run: nerdfleet/scripts/release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: nerdfleet-linux
          path: nerdfleet/dist/nerdfleet-*
      # For the Mac viewer to carry.
      - uses: actions/upload-artifact@v7
        with:
          name: nerdfleet-agents
          path: nerdfleet/target/agents/

  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nerdfleet
          persist-credentials: false
      - name: The nerdmux commit Cargo.toml pins
        id: pin
        run: |
          rev=$(sed -n 's/^nerdmux = { git = .*rev = "\([0-9a-f]*\)".*/\1/p' nerdfleet/Cargo.toml)
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Ndles/nerdmux
          ref: ${{ steps.pin.outputs.rev }}
          path: nerdmux
          ssh-key: ${{ secrets.NERDMUX_DEPLOY_KEY }}
          persist-credentials: false
      - name: Build against that checkout
        run: |
          mkdir -p .cargo
          printf '[patch."https://github.com/Ndles/nerdmux"]\nnerdmux = { path = "nerdmux" }\n' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nerdfleet
      - uses: actions/download-artifact@v8
        with:
          name: nerdfleet-agents
          path: agents
      - name: Check
        working-directory: nerdfleet
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build, carrying the Linux agents
        working-directory: nerdfleet
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          NERDFLEET_AGENTS="$GITHUB_WORKSPACE/agents/$version" cargo build --release --locked
          name="nerdfleet-$version-aarch64-macos"
          mkdir -p dist
          cp target/release/nerdfleet "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: nerdfleet-macos
          path: nerdfleet/dist/nerdfleet-*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nerdfleet-linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: nerdfleet-macos
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "nerdfleet ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
